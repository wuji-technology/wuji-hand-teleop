# Wuji Hand Serial Numbers Configuration
#
# Set serial number to enable a hand, or use null to disable.
# To get your hand's serial number: lsusb -v -d 0483:2000 | grep iSerial
#
# Input modes:
#   - use_joint_input: false (default)
#     Input topic: /hand_input
#     Expected format: Float32MultiArray with (25, 4, 4) matrices
#       - Single hand: 400 values
#       - Dual hands: 800 values (right first, then left)
#     Uses retargeting algorithm to convert matrices to joint angles
#
#   - use_joint_input: true
#     Input topic: /joint_input
#     Expected format: Float32MultiArray with direct joint angles
#       - Single hand: 20 values (5 fingers × 4 joints)
#       - Dual hands: 40 values (right first, then left)
#     Directly sets joint angles without retargeting


# Right hand serial number (null to disable)
right_hand_serial: "347B38703433"

# Left hand serial number (null to disable)
left_hand_serial: "3472387D3433"
# Use joint_input mode (true) or hand_input mode (false)
use_joint_input: false

# Input source: "avp" or "manus"
# Selects the corresponding retarget config: retarget_avp.yaml or retarget_manus.yaml
input_source: "avp"
