# Configuration for the avp_input ROS2 node (VisionPro → ROS topics with
# transform_avp_raw_data already applied to wrist/head poses).

input_source: visionpro
avp_ip: 172.16.12.77
publish_rate_hz: 200.0

publish_hand_topic: /hand_input
publish_wrist_topics: true
right_wrist_topic: /right_wrist
left_wrist_topic: /left_wrist
publish_head_topic: true
head_topic: /head_pose

include_right_hand: true
include_left_hand: true
