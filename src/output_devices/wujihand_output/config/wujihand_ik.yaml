# Wuji Hand Unified Configuration — Single source of truth for dexterous hand parameters
#
# This file is loaded by both of the following:
#   1. wujihand_controller node (via -c argument)
#   2. Launch files (via wuji_teleop_bringup.hand_defaults module)
#
# ===== Glove Integration Protocol =====
#
# Unified topic: /hand_input (std_msgs/Float32MultiArray)
# Data format: MediaPipe 21-point keypoints (21 x 3 = 63 floats per hand)
#   - Single hand: 63 values
#   - Dual hands: 126 values (right first, left second)
#
# To integrate a new glove:
#   1. Write an input node that converts glove data to MediaPipe 21-point format, publish to /hand_input
#   2. Add retarget config: config/retarget_{source}.yaml (shared for both hands)
#      or config/retarget_{source}_left.yaml + retarget_{source}_right.yaml (per-side)
#   3. Add LaunchConfigurationEquals condition block in the launch file
#
# Supported: manus (retarget_manus_left/right.yaml)

# Input source: "manus"
# Automatically loads corresponding retarget config (prefers retarget_{source}_{side}.yaml, falls back to retarget_{source}.yaml)
input_source: "manus"

# ===== Dexterous Hand Hardware =====
# How to get serial number: lsusb -v -d 0483:2000 | grep iSerial
left_hand:
  serial_number: "YOUR_LEFT_HAND_SERIAL"
  name: "left_hand"           # wujihandros2 driver namespace

right_hand:
  serial_number: "YOUR_RIGHT_HAND_SERIAL"
  name: "right_hand"          # wujihandros2 driver namespace

# ===== wujihandros2 Driver Parameters =====
driver:
  publish_rate: 1000.0        # Driver publish rate (Hz)
  filter_cutoff_freq: 10.0    # Hardware LP filter (restored to default, pending firmware PID diagnostics before adjustment)
  diagnostics_rate: 10.0      # Diagnostics publish rate (Hz)
